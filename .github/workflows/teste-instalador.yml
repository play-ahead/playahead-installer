# ============================================================
# Teste do instalador
#
# Roda em todo pedido de atualização (pull request) e à mão, pela
# aba Actions. Pela política de versões do CLAUDE.md, quem aprova
# uma versão nova é este teste passar, e não a opinião de ninguém.
#
# Duas etapas:
#   1. o dist/ está em dia com o lib/, e tudo passa no shellcheck;
#   2. o teste fixo, testes/ponta-a-ponta.sh, instala a base e o
#      Mautic numa máquina limpa e confere o resultado. O que ele
#      não cobre está no cabeçalho dele.
#
# A máquina é fixada em ubuntu-24.04, e não ubuntu-latest: o latest
# muda para o 26.04 entre outubro e novembro de 2026, e um Ubuntu LTS
# não testado faz o instalador perguntar se continua.
#
# As ações do GitHub são fixadas por commit, pelo mesmo motivo das
# imagens do instalador: uma tag pode ser movida.
# ============================================================

name: Teste do instalador

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teste-instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: dist em dia e shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: ShellCheck 0.11.0
        # A máquina traz o 0.9.0. A mesma versão de quem faz o build
        # evita aviso que só aparece de um lado.
        #
        # O arquivo é conferido pelo sha256 antes de ser aberto: é ele
        # que roda logo antes do ./build.sh --check, e um binário
        # trocado poderia mentir sobre o resultado.
        run: |
          curl -fsSL -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: dist/ em dia com o lib/
        run: ./build.sh --check

      - name: o check reprova um dist/ adulterado
        # Até 2026-11-11 uma linha PA_BUILD com comando dentro passava
        # pelo --check como "em dia". Este passo adultera o dist/ e
        # exige a reprovação, para o defeito não voltar calado.
        run: |
          linha="$(grep -n '^PA_BUILD=' dist/base.sh | head -n 1 | cut -d: -f1)"
          sed -i "$((linha + 1))i PA_BUILD=\"\$(echo adulterado >\&2)\"" dist/base.sh
          if ./build.sh --check; then
            echo "::error::./build.sh --check aceitou um dist/ adulterado"
            exit 1
          fi
          git checkout -- dist/base.sh
          ./build.sh --check

      - name: shellcheck no teste fixo e na trava
        run: shellcheck testes/ponta-a-ponta.sh testes/trava-versoes.sh

  ponta-a-ponta:
    name: instalação de ponta a ponta
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar o repositório
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Instalar a base e o Mautic e conferir
        run: sudo bash testes/ponta-a-ponta.sh

      - name: Liberar os logs para o artefato
        if: always()
        # O teste grava os logs com umask 077, legíveis só pelo root,
        # porque eles trazem a tela final com as senhas. O passo
        # seguinte não roda como root. Aqui as senhas são as
        # descartáveis desta máquina, que deixa de existir no fim.
        run: sudo chmod -R a+rX /tmp/teste-instalador || true

      - name: Guardar os logs
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: logs-do-teste
          path: /tmp/teste-instalador
          if-no-files-found: ignore
